[project]
name = "blueberry"
version = "0.1.0"
description = "Composable LLM performance testing with atomic primitives"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
optimizers = ["httpx>=0.27.0"]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
